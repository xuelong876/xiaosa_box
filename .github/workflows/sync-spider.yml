name: Sync spider.jar to Gitee

on:
  schedule:
    # UTC 时间，每月 5 日 01:00（北京时间 5 日 09:00）
    # 如果要北京时间凌晨 1 点，改成: '0 17 4 * *'
    - cron: '0 1 5 * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 克隆 Gitee 仓库（目标仓库）
      - name: Checkout Gitee repo
        env:
   
          GITEE_USER: xuelong88
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 配置git凭证，当前shell生效
          set -e
          git config --global credential.helper store
          git clone "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/xuelong88/xiaosa_box.git" repo
          cd repo
          git config user.name "GitHub Action Sync"
          git config user.email "actions@github.com"

      # 2. 下载远端 spider.jar
      - name: Download spider.jar
        run: |
          cd repo
          URLS=("https://qist.ugigc.dpdns.org/xiaosa/spider.jar"
          "https://gh-proxy.com/https://raw.githubusercontent.com/qist/tvbox/refs/heads/master/xiaosa/spider.jar")
          ok=0
          for u in "${URLS[@]}"; do
            echo "尝试: $u"
            if curl -fL --connect-timeout 10 --max-time 60 -o new_spider.jar "$u"; then
              if head -c 2 new_spider.jar | grep -q "PK"; then
                ok=1; echo "下载成功"; break
              fi
            fi
          done
          [ "$ok" = "1" ] || { echo "所有镜像失败"; exit 1; }

      # 3. 哈希比对并提交
      - name: Compare and commit
        id: check
        run: |
          cd repo
          if [ -f spider.jar ]; then
            old_hash=$(sha256sum spider.jar | awk '{print $1}')
          else
            old_hash="none"
          fi
          new_hash=$(sha256sum new_spider.jar | awk '{print $1}')
          echo "old=$old_hash"
          echo "new=$new_hash"

          if [ "$old_hash" != "$new_hash" ]; then
            mv new_spider.jar spider.jar
            git add spider.jar
            git commit -m "auto update spider.jar $(date +%Y-%m-%d)"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            rm -f new_spider.jar
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # 4. 推送到 Gitee
      - name: Push to Gitee
        if: steps.check.outputs.changed == 'true'
        run: |
          cd repo
          git push origin HEAD:master
